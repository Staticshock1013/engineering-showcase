# Project-local CI definition (also mirrored at repo root for monorepo runs).
name: quant-lab CI

on:
  push:
    paths:
      - "quant-lab/**"
      - ".github/workflows/quant-lab.yml"
  pull_request:
    paths:
      - "quant-lab/**"
      - ".github/workflows/quant-lab.yml"

defaults:
  run:
    working-directory: quant-lab

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: quant-lab/pyproject.toml
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Pytest
        run: pytest -q
