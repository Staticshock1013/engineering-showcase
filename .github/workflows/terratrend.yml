name: TerraTrend checks

on:
  push:
    paths:
      - "projects/06-terratrend-global/**"
      - ".github/workflows/terratrend.yml"
  pull_request:
    paths:
      - "projects/06-terratrend-global/**"
      - ".github/workflows/terratrend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/06-terratrend-global
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
